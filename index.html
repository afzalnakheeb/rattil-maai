<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recite With Me</title>
<meta name="description" content="Memorize the Quran to the standard of al-Haram and an-Nabawi: daily plan, listen, recite with an AI check, adhkar, and teacher sessions.">
<meta name="theme-color" content="#2A7458">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Recite With Me home">
      <img src="icons/icon.svg" alt="" width="34" height="34">
      <span class="brand-name">Recite With Me</span>
    </a>
    <button class="role-chip" id="roleChip" type="button" aria-label="Switch role">Student</button>
  </header>
  <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Recite With Me needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
