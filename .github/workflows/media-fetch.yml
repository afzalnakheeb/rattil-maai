# Temporary: downloads voice-over files listed in urls.txt and commits them to this branch.
name: media-fetch
on:
  push:
    branches: [media-fetch]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p media
          while read -r name url; do [ -n "$name" ] && curl -sSfL -o "media/$name" "$url"; done < urls.txt
          ls -la media
          git config user.name "media-fetch"; git config user.email "media-fetch@users.noreply.github.com"
          git add media && git commit -m "media: fetched files [skip ci]" && git push
