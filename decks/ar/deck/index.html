<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رتّل معي · العرض التقديمي</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-ar.css">
</head>
<body>
<div id="viewport">
  <div id="stage" role="region" aria-label="عرض رتّل معي">
    <div id="pattern"></div>
    <div class="chrome"><div class="brand"><img src="img/icon-512.png" alt=""><span class="ar">رتّل معي</span> <span lang="en" dir="ltr">Recite With Me</span></div><div class="url" dir="ltr">rattilmai.com</div></div>
    <div id="scenes"></div>
    <div id="caption" aria-live="off"></div>
  </div>
</div>
<nav id="deckbar" hidden aria-label="الشرائح">
  <a href="/decks/ar/" style="font:600 14px 'Plex Arabic',system-ui;color:#F4EFE2;opacity:.75;text-decoration:none;padding:12px">كل المواد</a>
  <button type="button" id="prev" aria-label="الشريحة السابقة">›</button>
  <div id="dots"></div>
  <span id="count">١ / ١٥</span>
  <button type="button" id="replay" aria-label="إعادة تشغيل الشريحة">إعادة</button>
  <button type="button" id="next" aria-label="الشريحة التالية">‹</button>
</nav>
<script type="module" src="deck.js"></script>

</body>
</html>
